items:
  bush2:
    enabled: true
    display_name: Bush
    behaviours:
      furniture:
        solid: false
        entity: item_display
        fixed_rotation: true
        placeable_on:
          ceiling: false
          floor: true
          walls: false
        opposite_direction: true
        sound:
          place:
            name: block.cherry_leaves.place
          break:
            name: block.cherry_leaves.break
