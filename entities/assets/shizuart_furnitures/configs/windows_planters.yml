info:
  namespace: shizuart_furnitures

items:
  windows_planter:
    enabled: true
    display_name: Windows planter
    behaviours:
      furniture:
        solid: true
        entity: item_display
        fixed_rotation: true
        placeable_on:
          ceiling: false
          floor: false
          walls: true
        hitbox:
          height: 1
          width: 2
          width_offset: -1
        opposite_direction: true
        sound:
          place:
            name: block.wood.place
          break:
            name: block.wood.break
        display_transformation:
          transform: FIXED
          translation:
            x: 0
            y: 0
            z: 0
          scale:
            x: 0.5
            y: 0.5
            z: 0.5
          right_rotation:
            axis_angle:
              angle: -90
              axis:
                x: 1
                y: 0
                z: 0
    resource:
      material: PAPER
      generate: false
      model_path: shizuart_furnitures:windows_planters/windows_planter
      model_id: 2660051
