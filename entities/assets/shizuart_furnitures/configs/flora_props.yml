info:
  namespace: shizuart_furnitures

items:
  flora_bush_plant:
    enabled: true
    display_name: Bush plant
    behaviours:
      furniture:
        solid: false
        entity: item_display
        fixed_rotation: true
        placeable_on:
          ceiling: false
          floor: true
          walls: false
        opposite_direction: true
        sound:
          place:
            name: block.cherry_leaves.place
          break:
            name: block.cherry_leaves.break
        display_transformation:
          transform: FIXED
          translation:
            x: 0
            y: 0
            z: 0
          scale:
            x: 0.5
            y: 0.5
            z: 0.5
          right_rotation:
            axis_angle:
              angle: -90
              axis:
                x: 1
                y: 0
                z: 0
    resource:
