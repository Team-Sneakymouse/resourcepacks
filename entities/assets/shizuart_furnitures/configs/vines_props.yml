items:
  vine_cube:
    enabled: true
    display_name: Vine cube
    behaviours:
      furniture:
        solid: false
        entity: item_display
        fixed_rotation: true
        placeable_on:
          ceiling: false
          floor: false
          walls: true
        opposite_direction: true
        sound:
          place:
            name: block.cherry_leaves.place
          break:
            name: block.cherry_leaves.break
        display_transformation:
          transform: FIXED
          translation:
            x: 0
            y: 0.03
            z: 0
          scale:
            x: 0.52
            y: 0.52
            z: 0.52
          right_rotation:
            axis_angle:
