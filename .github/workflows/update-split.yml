on:
  push:
    branches:
      - main
      - split
      - "26.2"
jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Normalize file metadata
        run: |
          timestamp=$(date -d "2024-01-01 00:00:00 UTC" +%s)
          find . -print0 | xargs -0 touch -d "@$timestamp"
      - name: Zip resourcepacks
        run: |
          export LC_ALL=C
          declare -A pack_ids # Keep track of pack IDs in an associative array
          mkdir -p resourcepacks

          for dir in  $(ls -d */); do
            if [ ! -f "${dir}pack.mcmeta" ]; then
              continue # Skip directories without pack.mcmeta
            fi
            echo "Packaging $dir"

            name=$(jq -r '.name // empty' "$dir/pack.mcmeta")
            id=$(jq -r '.id // empty' "$dir/pack.mcmeta")
            if [ -z "$name" ] || [ -z "$id" ]; then
              echo "Error: Invalid or missing 'name' or 'id' in pack.mcmeta for $dir" >&2
              exit 1
            fi

            cd $dir
            # Normalize timestamps and ensure deterministic ZIP
            find . -type f -print | sort -z | zip -q -X -@ "../resourcepacks/lom-${name}.zip"
            cd ..
          done
          for zip in resourcepacks/*.zip; do sha1sum "$zip"; done
      # upload updated zips to the SFTP server
      - name: Upload zips
        run: |
          changes=false

          # download remote hashes.json
          sshpass -p '${{ secrets.SFTP_PASSWORD }}' sftp -oStrictHostKeyChecking=no -P ${{ secrets.SFTP_PORT }} ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:/files/resourcepacks/ <<< $'get hashes.json'
          jq . hashes.json > /dev/null || { echo "Error: Invalid JSON"; exit 1; }
          mv hashes.json hashes_remote.json

          # keep track of current hashes
          echo "[" > hashes_local.json

          # process each zip file
          for zip in resourcepacks/*.zip; do
            echo "Uploading $zip"
            name=$(basename "$zip" .zip | cut -c 5-)
            local_hash=$(sha1sum "$zip" | awk '{print $1}')
            echo "{\"name\": \"${name}\", \"hash\": \"${local_hash}\"}," >> hashes_local.json

            remote_hash=$(jq -r ".[] | select(.name == \"$name\") | .hash" hashes_remote.json)
            echo "File: $name - Local hash: $local_hash - Remote hash: $remote_hash"

            if [ "$local_hash" = "$remote_hash" ]; then
              rm "$zip"
            else
              changes=true
            fi
            echo ""
          done

          # Remove the trailing comma and close the JSON array
          sed -i '$ s/,$//' hashes_local.json
          echo "]" >> hashes_local.json

          if [ "$changes" = true ]; then
            # upload the remaining files
            mv hashes_local.json resourcepacks/hashes.json
            sshpass -p '${{ secrets.SFTP_PASSWORD }}' sftp -oStrictHostKeyChecking=no -P ${{ secrets.SFTP_PORT }} ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:/files/resourcepacks/ <<< $'put resourcepacks/*'
            echo "FILES_UPDATED=true" >> $GITHUB_ENV
          fi
      - name: Send Multicraft command
        if: env.FILES_UPDATED == 'true'
        run: |
          # Validate the JSON file
          jq . resourcepacks/hashes.json || { echo "Error: Invalid JSON"; exit 1; }

          # Send the JSON file as the body of a single HTTP POST request
          curl -X POST \
            --url "${{ secrets.RESOURCEPACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            --data @resourcepacks/hashes.json
